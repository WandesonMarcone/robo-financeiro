name: Testes de fluxos isolados

on:
  push:
    paths:
      - 'atualizador_ciclico.py'
      - 'modules/lotes_atualizacao.py'
      - 'modules/scraper_acoes.py'
      - 'modules/scraper_fiis.py'
      - 'tests/test_lotes_atualizacao.py'
      - 'tests/test_sem_statusinvest.py'
      - 'scripts/notificar_falha_workflow.py'
      - 'modules/utils.py'
      - 'services/admin_api.py'
      - 'modules/GoogleDriveManager.py'
      - 'tests/test_medicao_drive.py'
      - 'scripts/persistir_fechamento_eod.py'
      - 'app.py'
      - 'tests/test_contingencia_eod.py'
      - '.github/workflows/fechamento-eod.yml'
      - 'services/orquestrador.py'
      - 'tests/test_retorno_crons.py'
      - 'services/coletor_tesouro_direto.py'
      - 'tests/test_tesouro_csv.py'
      - 'tests/test_auditoria_tesouro.py'
      - 'tests/test_auditoria_macro.py'
      - 'scripts/coletar_series_macro.py'
      - 'scripts/coletar_tesouro_direto.py'
      - '.github/workflows/coleta-tesouro.yml'
      - '.github/workflows/coleta-macro.yml'
      - '.github/workflows/coleta-etfs.yml'
      - '.github/workflows/coleta-bdrs.yml'
      - 'pipeline_dados/coletor_fnet.py'
      - 'tests/test_fnet_isolado.py'
      - 'tests/test_contingencia_fnet.py'
      - 'scripts/varredura_fnet_diaria.py'
      - '.github/workflows/varredura-fnet-diaria.yml'
      - 'atualizador_documentos.py'
      - 'scripts/processar_documentos_pendentes.py'
      - 'pipeline_dados/tipos_documento.py'
      - 'tests/test_tipos_documento.py'
      - '.github/workflows/main.yml'
      - '.github/workflows/test-fluxos-isolados.yml'
      - '.github/workflows/atualizacao-ciclica.yml'
  pull_request:
    paths:
      - 'atualizador_ciclico.py'
      - 'modules/lotes_atualizacao.py'
      - 'modules/scraper_acoes.py'
      - 'modules/scraper_fiis.py'
      - 'tests/test_lotes_atualizacao.py'
      - 'tests/test_sem_statusinvest.py'
      - 'scripts/notificar_falha_workflow.py'
      - 'modules/utils.py'
      - 'services/admin_api.py'
      - 'modules/GoogleDriveManager.py'
      - 'tests/test_medicao_drive.py'
      - 'scripts/persistir_fechamento_eod.py'
      - 'app.py'
      - 'tests/test_contingencia_eod.py'
      - '.github/workflows/fechamento-eod.yml'
      - 'services/orquestrador.py'
      - 'tests/test_retorno_crons.py'
      - 'services/coletor_tesouro_direto.py'
      - 'tests/test_tesouro_csv.py'
      - 'tests/test_auditoria_tesouro.py'
      - 'tests/test_auditoria_macro.py'
      - 'scripts/coletar_series_macro.py'
      - 'scripts/coletar_tesouro_direto.py'
      - '.github/workflows/coleta-tesouro.yml'
      - '.github/workflows/coleta-macro.yml'
      - '.github/workflows/coleta-etfs.yml'
      - '.github/workflows/coleta-bdrs.yml'
      - 'pipeline_dados/coletor_fnet.py'
      - 'tests/test_fnet_isolado.py'
      - 'tests/test_contingencia_fnet.py'
      - 'scripts/varredura_fnet_diaria.py'
      - '.github/workflows/varredura-fnet-diaria.yml'
      - 'atualizador_documentos.py'
      - 'scripts/processar_documentos_pendentes.py'
      - 'pipeline_dados/tipos_documento.py'
      - 'tests/test_tipos_documento.py'
      - '.github/workflows/main.yml'
      - '.github/workflows/test-fluxos-isolados.yml'
      - '.github/workflows/atualizacao-ciclica.yml'

concurrency:
  # Em rajadas de commits, mantém somente a validação mais recente da mesma referência.
  group: testes-fluxos-isolados-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Validar módulos e fluxos seguros
        run: |
          python -m py_compile app.py atualizador_ciclico.py atualizador_documentos.py scripts/processar_documentos_pendentes.py modules/lotes_atualizacao.py modules/scraper_acoes.py modules/scraper_fiis.py modules/utils.py services/admin_api.py bot/callbacks_menus.py services/coletor_etfs_bdrs.py pipeline_dados/tipos_documento.py modules/GoogleDriveManager.py services/orquestrador.py services/coletor_tesouro_direto.py pipeline_dados/coletor_fnet.py scripts/notificar_falha_workflow.py scripts/notificar_sucesso_atualizacao.py scripts/varredura_fnet_diaria.py scripts/coletar_tesouro_direto.py scripts/coletar_series_macro.py
          python -m unittest tests.test_lotes_atualizacao tests.test_sem_statusinvest tests.test_fnet_isolado tests.test_contingencia_fnet tests.test_medicao_drive tests.test_contingencia_eod tests.test_retorno_crons tests.test_tesouro_csv tests.test_auditoria_tesouro tests.test_auditoria_macro tests.test_tipos_documento -v
