name: Testes de fluxos isolados

on:
  push:
    paths:
      - 'atualizador_ciclico.py'
      - 'modules/lotes_atualizacao.py'
      - 'modules/scraper_acoes.py'
      - 'modules/scraper_fiis.py'
      - 'tests/test_lotes_atualizacao.py'
      - 'tests/test_sem_statusinvest.py'
      - 'scripts/notificar_falha_workflow.py'
      - 'modules/utils.py'
      - 'services/admin_api.py'
      - 'modules/GoogleDriveManager.py'
      - 'tests/test_medicao_drive.py'
      - 'scripts/persistir_fechamento_eod.py'
      - 'app.py'
      - 'tests/test_contingencia_eod.py'
      - '.github/workflows/fechamento-eod.yml'
      - 'services/orquestrador.py'
      - 'tests/test_retorno_crons.py'
      - 'pipeline_dados/coletor_fnet.py'
      - 'tests/test_fnet_isolado.py'
      - '.github/workflows/main.yml'
      - '.github/workflows/test-fluxos-isolados.yml'
      - '.github/workflows/atualizacao-ciclica.yml'
  pull_request:
    paths:
      - 'atualizador_ciclico.py'
      - 'modules/lotes_atualizacao.py'
      - 'modules/scraper_acoes.py'
      - 'modules/scraper_fiis.py'
      - 'tests/test_lotes_atualizacao.py'
      - 'tests/test_sem_statusinvest.py'
      - 'scripts/notificar_falha_workflow.py'
      - 'modules/utils.py'
      - 'services/admin_api.py'
      - 'modules/GoogleDriveManager.py'
      - 'tests/test_medicao_drive.py'
      - 'scripts/persistir_fechamento_eod.py'
      - 'app.py'
      - 'tests/test_contingencia_eod.py'
      - '.github/workflows/fechamento-eod.yml'
      - 'services/orquestrador.py'
      - 'tests/test_retorno_crons.py'
      - 'pipeline_dados/coletor_fnet.py'
      - 'tests/test_fnet_isolado.py'
      - '.github/workflows/main.yml'
      - '.github/workflows/test-fluxos-isolados.yml'
      - '.github/workflows/atualizacao-ciclica.yml'

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Validar módulos e fluxos seguros
        run: |
          python -m py_compile app.py atualizador_ciclico.py modules/lotes_atualizacao.py modules/scraper_acoes.py modules/scraper_fiis.py modules/utils.py services/admin_api.py modules/GoogleDriveManager.py services/orquestrador.py pipeline_dados/coletor_fnet.py scripts/notificar_falha_workflow.py scripts/notificar_sucesso_atualizacao.py
          python -m unittest tests.test_lotes_atualizacao tests.test_sem_statusinvest tests.test_fnet_isolado tests.test_medicao_drive tests.test_contingencia_eod tests.test_retorno_crons -v
