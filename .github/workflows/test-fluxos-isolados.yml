      - 'tests/test_tipos_documento.py'
      - '.github/workflows/main.yml'
      - '.github/workflows/test-fluxos-isolados.yml'
      - '.github/workflows/atualizacao-ciclica.yml'

concurrency:
  # Em rajadas de commits, mantém somente a validação mais recente da mesma referência.
  group: testes-fluxos-isolados-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Validar módulos e fluxos seguros
        run: |
          python -m py_compile fnet_scraper.py bot/callbacks_revisao.py app.py atualizador_ciclico.py atualizador_documentos.py scripts/processar_documentos_pendentes.py modules/lotes_atualizacao.py modules/scraper_acoes.py modules/scraper_fiis.py modules/utils.py services/admin_api.py bot/callbacks_menus.py services/coletor_etfs_bdrs.py services/oportunidades_unificadas.py services/sinais_macro_tesouro.py services/portfolio_api.py services/fundamentos_valuation.py services/planilha_fundamentos_valuation.py pipeline_dados/tipos_documento.py modules/GoogleDriveManager.py services/orquestrador.py services/coletor_tesouro_direto.py pipeline_dados/coletor_fnet.py pipeline_dados/coletor_docs_acoes.py scripts/notificar_falha_workflow.py scripts/notificar_sucesso_atualizacao.py scripts/varredura_fnet_diaria.py scripts/varredura_docs_acoes_trimestral.py scripts/coletar_tesouro_direto.py scripts/coletar_series_macro.py scripts/coletar_fundamentos_valuation.py scripts/auditar_mercado_multiclasse.py scripts/buscar_sinais_multiclasse.py scripts/buscar_oportunidades_unificadas.py scripts/adicionar_instrumento_mercado.py
          python -m unittest discover -s tests -p 'test_*.py' -v
