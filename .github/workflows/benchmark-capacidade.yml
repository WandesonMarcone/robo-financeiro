name: Benchmark isolado de capacidade
on:
  workflow_dispatch:
    inputs:
      tickers:
        description: Tickers separados por virgula (amostra explicita)
        required: true
        default: PETR4,MXRF11
      limite:
        description: Maximo de ativos (1 a 100)
        default: '10'
        required: true
permissions:
  contents: read
concurrency:
  group: benchmark-capacidade
  cancel-in-progress: false
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testes sem rede
        run: python -m unittest discover -s tests -p test_benchmark_capacidade.py -v
      - name: Medir consultas Yahoo sem credenciais
        env:
          BENCH_TICKERS: ${{ inputs.tickers }}
          BENCH_LIMIT: ${{ inputs.limite }}
        run: python scripts/benchmark_capacidade.py --tickers "$BENCH_TICKERS" --limite "$BENCH_LIMIT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-capacidade
          path: benchmark-resultados.json
          retention-days: 7
