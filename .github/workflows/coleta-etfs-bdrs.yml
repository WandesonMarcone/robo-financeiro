name: Coleta ETFs e BDRs (manual)
on:
  workflow_dispatch:
    inputs:
      tipo:
        description: 'Classe a atualizar (deixe em branco para todas, sem notificação diária)'
        required: false
        type: choice
        options: ['', 'ETF', 'BDR']
permissions:
  contents: read
concurrency:
  group: coleta-etfs-bdrs
  cancel-in-progress: false
jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - name: Coletar instrumentos cadastrados manualmente
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
        run: python scripts/coletar_etfs_bdrs.py --tipo "${{ inputs.tipo }}" --sem-notificacoes
