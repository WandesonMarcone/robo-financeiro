name: Testes de fluxos isolados
on:
  push:
    branches: [main]
    paths: ['scripts/benchmark_capacidade.py', 'scripts/diagnostico_fontes.py', 'atualizador_ciclico.py', 'scripts/notificar_falha_workflow.py', 'modules/lotes_atualizacao.py', 'modules/scraper_acoes.py', 'modules/scraper_fiis.py scripts/notificar_falha_workflow.py', 'tests/test_benchmark_capacidade.py', 'tests/test_diagnostico_fontes.py', 'tests/test_lotes_atualizacao.py', '.github/workflows/test-benchmark.yml', '.github/workflows/atualizacao-ciclica.yml']
  pull_request:
    paths: ['scripts/benchmark_capacidade.py', 'tests/test_benchmark_capacidade.py', '.github/workflows/test-benchmark.yml']
permissions:
  contents: read
jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Executar testes sem rede e sem credenciais
        run: |
          python -m unittest discover -s tests -p test_benchmark_capacidade.py -v
          python -m unittest discover -s tests -p test_diagnostico_fontes.py -v
          python -m unittest discover -s tests -p test_lotes_atualizacao.py -v
          python -m py_compile atualizador_ciclico.py modules/lotes_atualizacao.py modules/scraper_acoes.py modules/scraper_fiis.py
