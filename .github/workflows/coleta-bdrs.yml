name: Atualização diária de BDRs
on:
  schedule:
    # 19h35 em Brasília (UTC-3), separado de ETFs para não disputar fonte/fila.
    - cron: '35 22 * * 1-5'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: coleta-bdrs
  cancel-in-progress: false
jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - name: Coletar BDRs e notificar favoritos
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
        run: python scripts/coletar_etfs_bdrs.py --tipo BDR --limite 30
