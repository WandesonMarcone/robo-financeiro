name: Coleta macro oficial
on:
  schedule:
    # 19h15 em Brasília (UTC-3): após o fechamento da série diária do BCB.
    - cron: '15 22 * * 1-5'
    # Retentativa idempotente às 23h de Brasília quando a divulgação atrasar.
    - cron: '0 2 * * 2-6'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: coleta-macro-oficial
  cancel-in-progress: false
jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - name: Coletar Selic, CDI, IPCA e PTAX oficiais
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m scripts.coletar_series_macro
      - name: Avisar administrador se a coleta falhar
        if: failure() && !cancelled()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
        run: python -m scripts.notificar_falha_workflow
