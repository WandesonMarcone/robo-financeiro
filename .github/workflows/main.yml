name: Mercado unificado

on:
  schedule:
    # 10h, 12h, 14h, 16h e 18h de Brasília: oportunidades de todas as classes.
    - cron: '0 13,15,17,19,21 * * 1-5'
    # 19h15 de Brasília: atualização noturna única após o pregão.
    - cron: '15 22 * * 1-5'
    # Criptomoedas não fecham no fim de semana: mantém o histórico 24x7.
    - cron: '0 13,17,22 * * 0,6'
  workflow_dispatch:
    inputs:
      modo:
        description: Operação manual
        required: true
        type: choice
        default: oportunidades
        options:
          - oportunidades
          - atualizacao_noturna
          - corrigir_taxonomia_fiis
      limite_total:
        description: Teto por lote de ações e FIIs (1 a 30)
        required: false
        default: '30'
      novo_ticker:
        description: Novo ETF/BDR/cripto/moeda para cadastrar antes da varredura (opcional)
        required: false
        default: ''
      nova_classe:
        description: Classe do novo instrumento
        required: false
        type: choice
        default: ETF
        options:
          - ETF
          - BDR
          - CRIPTO
          - MOEDA
      simbolo_yahoo:
        description: Símbolo Yahoo, se for diferente do ticker (opcional)
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: mercado-unificado
  cancel-in-progress: false

jobs:
  mercado:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GOOGLE_CREDS: ${{ secrets.GOOGLE_CREDENTIALS }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      LOGO_DEV_TOKEN: ${{ secrets.LOGO_DEV_TOKEN }}
      SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
      EOD_SNAPSHOTS: 'true'
      ALERTA_CRIPTO_VARIACAO_PCT: ${{ vars.ALERTA_CRIPTO_VARIACAO_PCT || '4.0' }}
      ALERTA_MOEDA_VARIACAO_PCT: ${{ vars.ALERTA_MOEDA_VARIACAO_PCT || '0.75' }}
      COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Criar credencial temporária do Google
        shell: python
        run: |
          import os
          with open('credenciais.json', 'w', encoding='utf-8') as arquivo:
              arquivo.write(os.environ['GOOGLE_CREDS'])

      - name: Sincronizar CNPJs oficiais das ações — CVM
        if: github.event.schedule == '0 13,15,17,19,21 * * 1-5' || github.event.schedule == '15 22 * * 1-5' || (github.event_name == 'workflow_dispatch' && (inputs.modo == 'oportunidades' || inputs.modo == 'atualizacao_noturna'))
        timeout-minutes: 4
        continue-on-error: true
        run: python -m scripts.sincronizar_cnpj_acoes

      - name: Buscar oportunidades — ações, FIIs, ETFs, BDRs, cripto, moedas e Tesouro
        if: github.event.schedule == '0 13,15,17,19,21 * * 1-5' || (github.event_name == 'workflow_dispatch' && inputs.modo == 'oportunidades')
        shell: bash
        run: |
          if [ -n "${{ inputs.novo_ticker || '' }}" ]; then
            python -m scripts.adicionar_instrumento_mercado \
              --ticker "${{ inputs.novo_ticker }}" \
              --tipo "${{ inputs.nova_classe }}" \
              --simbolo-yahoo "${{ inputs.simbolo_yahoo }}"
          fi
          for classe in ETF BDR CRIPTO; do
            echo "Descobrindo novos ativos da classe ${classe}: planilha antes do Neon"
            python -m scripts.descobrir_instrumentos --tipo "${classe}" --limite 3 \
              || echo "::warning::Descoberta ${classe} temporariamente indisponível"
          done
          classes_atualizadas=0
          for classe in ETF BDR CRIPTO MOEDA; do
            echo "Atualizando ${classe} antes da triagem de oportunidades"
            if python -m scripts.coletar_etfs_bdrs --tipo "${classe}" --limite 60 --sem-notificacoes; then
              classes_atualizadas=$((classes_atualizadas + 1))
            else
              echo "::warning::Atualização ${classe} temporariamente indisponível; as demais classes continuarão"
            fi
          done
          if [ "${classes_atualizadas}" -eq 0 ]; then
            echo "::error::Nenhuma classe de mercado pôde ser atualizada"
            exit 1
          fi
          python -m scripts.coletar_series_macro || echo "::warning::Contexto macro temporariamente indisponível"
          python -m scripts.coletar_tesouro_direto || echo "::warning::Tesouro temporariamente indisponível"
          python -m scripts.buscar_oportunidades_unificadas

      - name: Atualizar e monitorar criptomoedas no fim de semana
        if: github.event.schedule == '0 13,17,22 * * 0,6'
        run: |
          python -m scripts.coletar_etfs_bdrs --tipo CRIPTO --limite 30 --sem-notificacoes
          python -m scripts.buscar_sinais_multiclasse

      - name: Corrigir setores e segmentos de FIIs
        if: github.event_name == 'workflow_dispatch' && inputs.modo == 'corrigir_taxonomia_fiis'
        run: python -m scripts.corrigir_taxonomia_fiis --usar-contingencia

      - name: Planejar cobertura integral de ações e FIIs
        if: github.event.schedule == '15 22 * * 1-5' || (github.event_name == 'workflow_dispatch' && inputs.modo == 'atualizacao_noturna')
        id: planejar
        run: python -m scripts.planejar_ciclo_noturno --limite-total "${{ inputs.limite_total || '30' }}" --github-output "$GITHUB_OUTPUT"
      - name: Atualização noturna multiclasse em lotes controlados
        if: github.event.schedule == '15 22 * * 1-5' || (github.event_name == 'workflow_dispatch' && inputs.modo == 'atualizacao_noturna')
        shell: bash
        run: |
          ciclos="${{ steps.planejar.outputs.ciclos }}"
          echo "Base: ${{ steps.planejar.outputs.acoes }} ações e ${{ steps.planejar.outputs.fiis }} FIIs; ${ciclos} lote(s)."
          for ciclo in $(seq 1 "${ciclos}"); do
            echo "Iniciando lote ${ciclo}/${ciclos}"
            python atualizador_ciclico.py --limite-total "${{ inputs.limite_total || '30' }}" --orcamento-segundos 180 --pausa-segundos 2
          done

          for classe in ETF BDR CRIPTO; do
            echo "Descoberta noturna da classe ${classe}: planilha antes do Neon"
            python -m scripts.descobrir_instrumentos --tipo "${classe}" --limite 3 \
              || echo "::warning::Descoberta ${classe} temporariamente indisponível"
          done

          classes_atualizadas=0
          for classe in ETF BDR CRIPTO MOEDA; do
            echo "Atualização noturna da classe ${classe}"
            if python -m scripts.coletar_etfs_bdrs --tipo "${classe}" --limite 60 --sem-notificacoes; then
              classes_atualizadas=$((classes_atualizadas + 1))
            else
              echo "::warning::Atualização ${classe} temporariamente indisponível; as demais classes continuarão"
            fi
          done
          if [ "${classes_atualizadas}" -eq 0 ]; then
            echo "::error::Nenhuma classe de mercado pôde ser atualizada"
            exit 1
          fi

          python -m scripts.coletar_series_macro
          python -m scripts.coletar_tesouro_direto
          python -m scripts.persistir_fechamento_eod
          python -m scripts.coletar_proventos_eventos --limite-por-classe 20 --janela-dias 75
          python -m scripts.auditar_cobertura_noturna --max-atraso-dias 1
          python -m scripts.auditar_mercado_multiclasse
          python -m scripts.corrigir_taxonomia_fiis --usar-contingencia

      - name: Avisar administrador somente sobre falha
        if: failure() && !cancelled()
        continue-on-error: true
        run: python -m scripts.notificar_falha_workflow
