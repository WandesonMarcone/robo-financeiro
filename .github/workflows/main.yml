name: Robô Financeiro

on:
  push:
  schedule:
    - cron: '0 13,15,17,19,21 * * 1-5'
  workflow_dispatch: 

jobs:
  quality:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Instalar ruff e pytest
        run: pip install ruff pytest

      - name: Lint (Ruff)
        run: ruff check config.py main.py atualizador_documentos.py modules/seguranca.py bot/comandos.py bot/callbacks_revisao.py bot/confirmacoes.py services/orquestrador.py tests/

      - name: Testes
        run: pytest -v

  build:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Criar arquivo de credenciais
        shell: python
        env:
          # O nome da variável aqui (GOOGLE_CREDS) tem de ser igual ao que está no seu script
          GOOGLE_CREDS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          import os
          with open('credenciais.json', 'w') as f:
              f.write(os.environ['GOOGLE_CREDS'])

      - name: Rodar o Robô
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LOGO_DEV_TOKEN: ${{ secrets.LOGO_DEV_TOKEN }}
          # Variáveis novas do Google Drive
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          DRIVE_ROOT_FOLDER_ID: ${{ secrets.DRIVE_ROOT_FOLDER_ID }}
          # Planilha e espelhamento PostgreSQL (config.py lê do ambiente)
          GOOGLE_CREDS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SPREADSHEET_URL: ${{ secrets.SPREADSHEET_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ESPELHAMENTO_PG_ATIVO: ${{ secrets.ESPELHAMENTO_PG_ATIVO }}
        run: python app.py

