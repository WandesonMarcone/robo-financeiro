name: Coleta Tesouro Direto oficial
on:
  schedule:
    # 19h30 em Brasília, após o fechamento regular de 18h do Tesouro Direto.
    - cron: '30 22 * * 1-5'
    # Segunda chance às 22h30 em Brasília, idempotente por título e data-base.
    - cron: '30 1 * * 2-6'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: coleta-tesouro-direto
  cancel-in-progress: false
jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - name: Coletar preços e taxas oficiais
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m scripts.coletar_tesouro_direto
      - name: Avisar administrador se a coleta falhar
        if: failure() && !cancelled()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
        run: python -m scripts.notificar_falha_workflow
