name: Fundamentos para valuation

on:
  schedule:
    - cron: '37 */2 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/fundamentos-valuation.yml'
  workflow_dispatch:
    inputs:
      ticker:
        description: "Ticker individual; vazio executa fila automática de ações"
        required: false
        type: string
      limite:
        description: "Teto de ações por lote (1 a 10)"
        required: false
        type: choice
        default: '10'
        options:
          - '4'
          - '6'
          - '8'
          - '10'
      anos:
        description: "Histórico fundamental"
        required: true
        type: choice
        default: '5'
        options:
          - '3'
          - '4'
          - '5'

permissions:
  contents: read

concurrency:
  group: fundamentos-valuation
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GOOGLE_CREDS: ${{ secrets.GOOGLE_CREDENTIALS }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Criar credencial temporária do Google
        shell: python
        run: |
          import os
          with open('credenciais.json', 'w', encoding='utf-8') as arquivo:
              arquivo.write(os.environ['GOOGLE_CREDS'])
      - name: Validar CNPJs oficiais das ações — CVM
        # A fila não usa mapas manuais; a FCA atual e os arquivos oficiais
        # recentes são conciliados antes de escolher o lote.
        run: python -m scripts.sincronizar_cnpj_acoes
        # A indisponibilidade momentânea da FCA não pode bloquear uma fila que
        # já possui identidades oficialmente validadas no Neon.
        continue-on-error: true
      - name: Migrar fundamentos para armazenamento por período
        run: python -m scripts.migrar_fundamentos_consolidados
      - name: Coletar DFP, ITR, proventos e cobertura dos métodos
        env:
          TICKER: ${{ inputs.ticker }}
          ANOS: ${{ inputs.anos || '5' }}
          LIMITE: ${{ inputs.limite || '10' }}
        run: |
          if [ -n "$TICKER" ]; then
            python -m scripts.coletar_fundamentos_valuation --ticker "$TICKER" --anos "$ANOS"
          else
            python -m scripts.coletar_fundamentos_valuation --automatico --limite "$LIMITE"
          fi
      - name: Enviar resumo da rodada ao Telegram
        if: always() && !cancelled() && hashFiles('resultado-fundamentos.json') != ''
        continue-on-error: true
        run: python -m scripts.notificar_fundamentos
      - name: Avisar administrador sobre interrupção sem relatório
        if: failure() && !cancelled() && hashFiles('resultado-fundamentos.json') == ''
        continue-on-error: true
        env:
          ETAPA_FALHA: fundamentos para valuation de ${{ inputs.ticker }}
        run: python -m scripts.notificar_falha_workflow
