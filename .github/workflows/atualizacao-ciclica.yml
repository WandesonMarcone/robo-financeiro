name: Atualização cíclica de ativos

on:
  schedule:
    # Horários em UTC: ciclos diurnos e madrugada/primeiras horas em Brasília. Cada ciclo
    # permite até 30 ativos, pausa de 2s e orçamento interno de 9 minutos.
    - cron: "30 3,5,7,9,12,14,16,18,20,22,23 * * 1-5"
  workflow_dispatch:
    inputs:
      ticker:
        description: "Ticker isolado (ex.: PETR4 ou MXRF11); deixe vazio para lote"
        required: false
        default: ""
      limite_total:
        description: Teto total de ativos no ciclo (1 a 30)
        required: true
        default: "30"

permissions:
  contents: read

concurrency:
  group: coleta-mercado-planilha
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Testar seleção de lotes sem rede
        run: python -m unittest tests.test_lotes_atualizacao -v
      - name: Criar credencial temporária do Google
        shell: python
        env:
          GOOGLE_CREDS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          import os
          with open("credenciais.json", "w", encoding="utf-8") as arquivo:
              arquivo.write(os.environ["GOOGLE_CREDS"])
      - name: Atualizar até 30 ativos sem notificações
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TICKER_ISOLADO: ${{ inputs.ticker }}
        run: >-
          python atualizador_ciclico.py
          --ticker "${{ inputs.ticker }}"
          --limite-total "${{ inputs.limite_total || '30' }}"
          --orcamento-segundos 540
          --pausa-segundos 2
      - name: Avisar conclusão de busca isolada
        if: success() && inputs.ticker != ''
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
          TICKER_ISOLADO: ${{ inputs.ticker }}
        run: python scripts/notificar_sucesso_atualizacao.py
      - name: Avisar administrador somente sobre falha do ciclo
        if: failure()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python scripts/notificar_falha_workflow.py
