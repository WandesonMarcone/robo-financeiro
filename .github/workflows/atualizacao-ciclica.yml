name: Atualização cíclica de ativos

on:
  schedule:
    # Uma única execução noturna executa quatro lotes sequenciais de até 30.
    # Isso evita depender de vários crons, pois o GitHub pode atrasar ou omitir
    # agendamentos. Na base atual, quatro lotes cobrem ações e FIIs com sobra.
    - cron: "10 3 * * 1-5"
  workflow_dispatch:
    inputs:
      ticker:
        description: "Ticker isolado (ex.: PETR4 ou MXRF11); deixe vazio para lote"
        required: false
        default: ""
      limite_total:
        description: Teto total de ativos no ciclo (1 a 30)
        required: true
        default: "30"

permissions:
  contents: read

concurrency:
  group: coleta-mercado-planilha
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Testar seleção de lotes sem rede
        run: python -m unittest tests.test_lotes_atualizacao -v
      - name: Criar credencial temporária do Google
        shell: python
        env:
          GOOGLE_CREDS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          import os
          with open("credenciais.json", "w", encoding="utf-8") as arquivo:
              arquivo.write(os.environ["GOOGLE_CREDS"])
      - name: Atualizar cobertura completa sem notificações
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TICKER_ISOLADO: ${{ inputs.ticker }}
        shell: bash
        run: |
          if [ -n "${{ inputs.ticker }}" ]; then
            python atualizador_ciclico.py --ticker "${{ inputs.ticker }}" --limite-total "${{ inputs.limite_total || '30' }}" --orcamento-segundos 180 --pausa-segundos 2
          else
            for ciclo in 1 2 3 4; do
              echo "Iniciando lote ${ciclo}/4"
              python atualizador_ciclico.py --limite-total 30 --orcamento-segundos 180 --pausa-segundos 2
            done
          fi
      - name: Avisar conclusão de busca isolada
        if: success() && inputs.ticker != ''
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
          TICKER_ISOLADO: ${{ inputs.ticker }}
        run: python scripts/notificar_sucesso_atualizacao.py
      - name: Avisar administrador somente sobre falha do ciclo
        if: failure()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python scripts/notificar_falha_workflow.py
