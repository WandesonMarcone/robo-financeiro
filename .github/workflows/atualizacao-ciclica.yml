name: Atualização cíclica de ativos

on:
  schedule:
    # Uma única execução calcula os lotes necessários para a base inteira.
    # Isso evita ativos esquecidos quando o cadastro crescer.
    - cron: "10 3 * * 1-5"
  workflow_dispatch:
    inputs:
      ticker:
        description: "Ticker isolado (ex.: PETR4 ou MXRF11); deixe vazio para lote"
        required: false
        default: ""
      limite_total:
        description: Teto total de ativos no ciclo (1 a 30)
        required: true
        default: "30"

permissions:
  contents: read

concurrency:
  group: coleta-mercado-planilha
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Testar seleção de lotes sem rede
        run: python -m unittest tests.test_lotes_atualizacao -v
      - name: Criar credencial temporária do Google
        shell: python
        env:
          GOOGLE_CREDS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          import os
          with open("credenciais.json", "w", encoding="utf-8") as arquivo:
              arquivo.write(os.environ["GOOGLE_CREDS"])
      - name: Planejar cobertura da base inteira
        if: inputs.ticker == ''
        id: planejar
        run: python -m scripts.planejar_ciclo_noturno --limite-total 30 --github-output "$GITHUB_OUTPUT"
      - name: Atualizar cobertura completa sem notificações
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TICKER_ISOLADO: ${{ inputs.ticker }}
        shell: bash
        run: |
          if [ -n "${{ inputs.ticker }}" ]; then
            python atualizador_ciclico.py --ticker "${{ inputs.ticker }}" --limite-total "${{ inputs.limite_total || '30' }}" --orcamento-segundos 180 --pausa-segundos 2
          else
            ciclos="${{ steps.planejar.outputs.ciclos }}"
            echo "Base: ${{ steps.planejar.outputs.acoes }} ações e ${{ steps.planejar.outputs.fiis }} FIIs; ${ciclos} lote(s)."
            for ciclo in $(seq 1 "$ciclos"); do
              echo "Iniciando lote ${ciclo}/${ciclos}"
              python atualizador_ciclico.py --limite-total 30 --orcamento-segundos 180 --pausa-segundos 2
            done
          fi
      - name: Auditar cobertura real da atualização noturna
        if: success() && inputs.ticker == ''
        run: python -m scripts.auditar_cobertura_noturna --max-atraso-dias 1
      - name: Corrigir setores pendentes de FIIs por documentos oficiais
        if: success() && inputs.ticker == ''
        run: python -m scripts.corrigir_taxonomia_fiis
      - name: Avisar conclusão de busca isolada
        if: success() && inputs.ticker != ''
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
          TICKER_ISOLADO: ${{ inputs.ticker }}
        run: python -m scripts.notificar_sucesso_atualizacao
      - name: Avisar administrador somente sobre falha do ciclo
        if: failure()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python -m scripts.notificar_falha_workflow
